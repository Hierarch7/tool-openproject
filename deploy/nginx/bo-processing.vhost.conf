# vhost bo.processing.systems → /etc/nginx/sites-available/bo-processing.conf (+ симлинк в sites-enabled)
#
# Второй инстанс OpenProject на gambit, слушает 127.0.0.1:8097. Домен проксируется
# через Cloudflare (оранжевое облако), реальный IP клиента подставляется глобально
# в /etc/nginx/conf.d/cdn-real-ip.conf — здесь про это ничего не нужно.
#
# Имя upstream'а обязано отличаться от op_backend из bo.conf: nginx держит их в
# одном пространстве имён на весь конфиг, дубль просто не даст ему стартовать.

upstream op_processing_backend {
    server 127.0.0.1:8097;
    keepalive 16;
}

server {
    listen 84.32.186.99:80;
    server_name bo.processing.systems;
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 84.32.186.99:443 ssl http2;
    server_name bo.processing.systems;

    ssl_certificate     /etc/letsencrypt/live/bo.processing.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bo.processing.systems/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    access_log /var/log/nginx/bo-processing.access.log;
    error_log  /var/log/nginx/bo-processing.error.log;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    # Совместное редактирование (OpenProject 17+): WebSocket до hocuspocus,
    # который живёт внутри контейнера под supervisord. Без Upgrade/Connection
    # соединение обрывается и редактор молча уходит в read-only.
    location /hocuspocus {
        proxy_pass http://op_processing_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Живое обновление задач: WebSocket до ActionCable, смонтированного в config/routes.rb.
    # Без Upgrade/Connection nginx закрывает соединение как обычный HTTP-запрос, ActionCable
    # молча уходит в бесконечные переподключения, и статусы снова обновляются только по F5.
    location /cable {
        proxy_pass http://op_processing_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location / {
        proxy_pass http://op_processing_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}
