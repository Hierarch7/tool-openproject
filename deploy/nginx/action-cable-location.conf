
    # Живое обновление задач: WebSocket до ActionCable, смонтированного в config/routes.rb.
    # Без Upgrade/Connection nginx закрывает соединение как обычный HTTP-запрос, ActionCable
    # молча уходит в бесконечные переподключения, и статусы снова обновляются только по F5.
    location /cable {
        proxy_pass http://op_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
