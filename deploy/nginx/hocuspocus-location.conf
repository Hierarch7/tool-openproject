
    # Совместное редактирование (OpenProject 17+): WebSocket до hocuspocus,
    # который живёт внутри контейнера под supervisord. Без Upgrade/Connection
    # соединение обрывается и редактор молча уходит в read-only.
    location /hocuspocus {
        proxy_pass http://op_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
