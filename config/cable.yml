# Postgres rather than Redis: this deployment has no Redis (the cache is memcached), and
# LISTEN/NOTIFY needs no infrastructure beyond the database we already run. Payloads are
# limited to 8 kB, which is ample — we broadcast an id, never a record.
#
# Not the `async` adapter Rails ships by default either, in any environment that has more than
# one process. Journals are frequently written by the good_job worker, which is a process of
# its own, and `async` keeps broadcasts inside the process that made them — those updates
# would simply never reach the browsers, which are connected to Puma.
default: &default
  adapter: postgresql
  channel_prefix: open_project

development:
  <<: *default

test:
  adapter: test

production:
  <<: *default
  channel_prefix: open_project_production
