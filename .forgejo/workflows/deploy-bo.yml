name: Deploy OpenProject

# Сборка образа из этого репозитория и выкат на инстансы OpenProject.
#
#   пуш в main       → прод
#   пуш в bo-staging → стенд на hy (127.0.0.1:8096)
#   ручной запуск    → с выбором окружения
#
# Джобы идут на self-hosted runner'ах в host-режиме: образ собирается на том же
# хосте, куда потом и катится, поэтому реестр не нужен.

on:
  push:
    branches:
      - main
      - bo-staging
  workflow_dispatch:
    inputs:
      target:
        description: Окружение
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-bo-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: bo-openproject

jobs:
  hy:
    name: bo.hesoyam.biz (hy)
    runs-on: hy-op
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Выбрать окружение
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TARGET="$INPUT_TARGET"
          elif [ "$REF_NAME" = "main" ]; then
            TARGET=production
          else
            TARGET=staging
          fi
          case "$TARGET" in
            staging|production) ;;
            *) echo "неизвестное окружение: '$TARGET'" >&2; exit 2 ;;
          esac
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Окружение: $TARGET"

      - name: Собрать образ
        run: |
          set -eu
          docker build \
            -f docker/prod/Dockerfile \
            --target all-in-one \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:$TARGET" \
            .

      - name: Выкатить
        run: sudo /opt/bo-deploy/deploy.sh "$TARGET" "$GITHUB_SHA"

      - name: Smoke-проверка
        run: sudo /opt/bo-deploy/smoke.sh "$TARGET"

  gambit:
    name: bo.processing.systems (gambit)
    runs-on: gambit-op
    timeout-minutes: 180
    # Стенда на gambit нет — хост участвует только в прод-выкате. Условие проверяет ещё и
    # тип события: у workflow_dispatch ref_name это ветка запуска, то есть по умолчанию main,
    # и без этой оговорки ручной прогон со staging выкатил бы здесь прод (deploy.sh ниже
    # захардкожен на processing).
    if: (github.event_name == 'push' && github.ref_name == 'main') || github.event.inputs.target == 'production'

    steps:
      - uses: actions/checkout@v4

      - name: Собрать образ
        run: |
          set -eu
          docker build \
            -f docker/prod/Dockerfile \
            --target all-in-one \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:production" \
            .

      - name: Выкатить
        run: sudo /opt/bo-deploy/deploy.sh processing "$GITHUB_SHA"

      - name: Smoke-проверка
        run: sudo /opt/bo-deploy/smoke.sh processing
